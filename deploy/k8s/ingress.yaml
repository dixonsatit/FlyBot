# stackchan.kkh.go.th: the robot reaches the bridge from any network (home WiFi) and the
# dashboard is reachable without the VPN. TLS ends at the hospital's proxy (FortiWeb) in front
# of the cluster, like the other *.kkh.go.th hosts, which must pass WebSocket upgrades on /mqtt.
# Both paths need credentials: dashboard basic auth and the MQTT password.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stackchan
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"          # voice clips up, WAV replies down
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"     # MQTT stays connected; voice turns take ~10 s
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: stackchan.kkh.go.th
      http:
        paths:
          - path: /mqtt
            pathType: Prefix
            backend: {service: {name: mosquitto-ws, port: {number: 9001}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: flybot-dashboard, port: {number: 8080}}}
