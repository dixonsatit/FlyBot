# NOT applied by kustomize. Create the real Secret from the command line instead of committing it:
#   kubectl -n flybot create secret generic flybot-secrets \
#     --from-literal=mqtt-password='...' \
#     --from-file=calendar-url=calendar.key \
#     --from-literal=webhook-url='https://...' \
#     --from-literal=llm-api-key='...' \
#     --from-literal=github-token='github_pat_...'
apiVersion: v1
kind: Secret
metadata:
  name: flybot-secrets
  namespace: flybot
type: Opaque
stringData:
  mqtt-password: change-me          # the robot's (MQTT_PASSWORD in flybot_config.h)
  bridge-mqtt-password: change-me   # the bridge's own MQTT login
  dashboard-password: change-me     # dashboard login (user admin)
  calendar-url: ""
  webhook-url: ""
  llm-api-key: ""
  github-token: ""
