apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    per_listener_settings false
    listener 1883
    # MQTT over WebSocket for the robot away from the LAN (stackchan.kkh.go.th/mqtt, ingress.yaml);
    # TLS ends at the hospital's proxy in front of the cluster
    listener 9001
    protocol websockets
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    acl_file /mosquitto/auth/acl
    persistence false
    log_dest stdout
  # Two logins: the bridge may do anything under the base topic; the robot (whose password sits
  # in its flash) may only publish what a robot publishes and read what is sent to it, so a
  # password taken from a robot cannot command it as the bridge or read the bridge's side.
  acl: |
    user flybot
    topic readwrite stackchan/#
    user stackchan
    topic write stackchan/sensor/#
    topic write stackchan/snapshot
    topic write stackchan/selftest
    topic write stackchan/event/#
    topic write stackchan/debug/#
    topic read stackchan/command
    topic read stackchan/snapshot/request
    topic read stackchan/announce
    topic read stackchan/voice/progress
    topic read stackchan/leds
    topic read stackchan/camera/stream
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels: {app: mosquitto}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mosquitto}
  template:
    metadata:
      labels: {app: mosquitto}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # mosquitto needs a hashed password file; build it from the Secret at start. Line breaks
        # are dropped (a Secret made with --from-file keeps the file's trailing newline) so the
        # hash matches what the bridge (FLYBOT_PASSWORD, stripped) and the robot send.
        - name: passwd
          image: eclipse-mosquitto:2
          command:
            - sh
            - -c
            - |
              clean() { printf %s "$1" | tr -d '\r\n'; }
              mosquitto_passwd -b -c /mosquitto/auth/passwd "$BRIDGE_USER" "$(clean "$BRIDGE_PASSWORD")" &&
              mosquitto_passwd -b /mosquitto/auth/passwd "$ROBOT_USER" "$(clean "$ROBOT_PASSWORD")" &&
              cp /mosquitto/config/acl /mosquitto/auth/acl && chmod 0600 /mosquitto/auth/passwd /mosquitto/auth/acl
          env:
            - name: BRIDGE_USER
              valueFrom: {configMapKeyRef: {name: flybot-config, key: FLYBOT_USERNAME}}
            - name: BRIDGE_PASSWORD
              valueFrom: {secretKeyRef: {name: flybot-secrets, key: bridge-mqtt-password}}
            - name: ROBOT_USER
              value: stackchan
            - name: ROBOT_PASSWORD
              valueFrom: {secretKeyRef: {name: flybot-secrets, key: mqtt-password}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: auth, mountPath: /mosquitto/auth}
            - {name: config, mountPath: /mosquitto/config}
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - {name: mqtt, containerPort: 1883}
            - {name: ws, containerPort: 9001}
          readinessProbe:
            tcpSocket: {port: mqtt}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mqtt}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /mosquitto/config}
            - {name: auth, mountPath: /mosquitto/auth}
      volumes:
        - name: config
          configMap: {name: mosquitto-config}
        - name: auth
          emptyDir: {}
---
# The robot connects over WiFi, so the broker must be reachable from the LAN:
# NodePort 31883 on any node by default; use type LoadBalancer if the cluster has one (e.g. MetalLB).
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  type: NodePort
  selector: {app: mosquitto}
  ports:
    - {name: mqtt, port: 1883, targetPort: mqtt, nodePort: 31883}
---
# MQTT over WebSocket only through the ingress (stackchan.kkh.go.th/mqtt): no port on the nodes
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-ws
spec:
  selector: {app: mosquitto}
  ports:
    - {name: ws, port: 9001, targetPort: ws}
