apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    persistence false
    log_dest stdout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  labels: {app: mosquitto}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mosquitto}
  template:
    metadata:
      labels: {app: mosquitto}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # mosquitto needs a hashed password file; build it from the Secret at start
        - name: passwd
          image: eclipse-mosquitto:2
          command: ["sh", "-c", "mosquitto_passwd -b -c /mosquitto/auth/passwd \"$MQTT_USER\" \"$MQTT_PASSWORD\" && chmod 0600 /mosquitto/auth/passwd"]
          env:
            - name: MQTT_USER
              valueFrom: {configMapKeyRef: {name: flybot-config, key: FLYBOT_USERNAME}}
            - name: MQTT_PASSWORD
              valueFrom: {secretKeyRef: {name: flybot-secrets, key: mqtt-password}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: auth, mountPath: /mosquitto/auth}
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - {name: mqtt, containerPort: 1883}
          readinessProbe:
            tcpSocket: {port: mqtt}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mqtt}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: config, mountPath: /mosquitto/config}
            - {name: auth, mountPath: /mosquitto/auth}
      volumes:
        - name: config
          configMap: {name: mosquitto-config}
        - name: auth
          emptyDir: {}
---
# The robot connects over WiFi, so the broker must be reachable from the LAN:
# NodePort 31883 on any node by default; use type LoadBalancer if the cluster has one (e.g. MetalLB).
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  type: NodePort
  selector: {app: mosquitto}
  ports:
    - {name: mqtt, port: 1883, targetPort: mqtt, nodePort: 31883}
