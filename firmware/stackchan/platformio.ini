; StackChan (M5Stack CoreS3) firmware for the FlyBot MQTT bridge.
;   cp src/flybot_config.example.h src/flybot_config.h  # WiFi / broker / servo settings
;   pio run -t upload && pio device monitor                        # DIY StackChan, SG90 servos
;   pio run -e stackchan-official -t upload && pio device monitor  # M5Stack StackChan, SCS0009 servos

[platformio]
default_envs = m5stack-cores3

[env]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    m5stack/M5Unified
    m5stack/M5CoreS3
    meganetaaan/M5Stack-Avatar
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7

[env:m5stack-cores3]
lib_deps =
    ${env.lib_deps}
    madhephaestus/ESP32Servo@^3

[env:stackchan-official]
build_flags =
    ${env.build_flags}
    -DSTACKCHAN_OFFICIAL=1
lib_deps =
    ${env.lib_deps}
    https://github.com/ftservo/FTServo_Arduino.git#64922cda46e56b21b8c1d9e830d936a1941645ae
