; StackChan (M5Stack CoreS3 + SG90) firmware for the FlyBot MQTT bridge.
;   cp src/flybot_config.example.h src/flybot_config.h  # WiFi / broker / servo settings
;   pio run -t upload && pio device monitor

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    m5stack/M5Unified
    m5stack/M5CoreS3
    meganetaaan/M5Stack-Avatar
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    madhephaestus/ESP32Servo@^3
