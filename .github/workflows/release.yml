name: Test and release

# GitHub releases are marked pre-release until the firmware has been tested on the robot;
# set to "false" to publish normal releases.
env:
  MARK_PRERELEASE: "true"

on:
  push:
    branches: [main, master, "claude/vibrant-feynman-851fls"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,llm,calendar]"
      - run: pytest -q

  release:
    # versions, tags, CHANGELOG.md and the GitHub release come from Conventional Commits
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Semantic release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: github-actions@users.noreply.github.com
      - name: Mark as pre-release
        if: steps.release.outputs.released == 'true' && env.MARK_PRERELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.release.outputs.tag }}" --repo "${{ github.repository }}" --prerelease --latest=false

  image:
    # container image for the Kubernetes deployment (deploy/k8s), built from the release tag
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/flybot:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/flybot:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
