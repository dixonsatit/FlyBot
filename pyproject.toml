[project]
name = "flybot"
version = "0.18.0"
description = "FlyWire Codex connectome circuits driving an M5Stack StackChan over MQTT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "nengo>=4.0", "paho-mqtt>=2.0"]

[project.optional-dependencies]
fast = ["scipy>=1.10"]
dev = ["pytest>=7", "pillow>=10"]  # pillow: tools/make_vlw_font.py
llm = ["anthropic>=1.11", "openai>=3"]
calendar = ["icalendar>=6", "recurring-ical-events>=3", "tzdata"]
his = ["pymysql>=1.1", "tzdata"]

[project.scripts]
flybot-mqtt = "flybot.mqtt_bridge:main"
flybot-sim = "flybot.sim:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flybot"]

[tool.setuptools.package-data]
flybot = ["web/*.html"]

[tool.pytest.ini_options]
addopts = "-p no:nengo"
filterwarnings = ["ignore::UserWarning:nengo"]

# Releases: python-semantic-release bumps project.version from Conventional Commits
# (feat -> minor, fix/perf -> patch, "!"/BREAKING CHANGE -> major once >= 1.0),
# tags v{version}, updates CHANGELOG.md and creates the GitHub release (.github/workflows/release.yml).
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.main]
match = "^(main|master|claude/vibrant-feynman-851fls)$"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
upload_to_vcs_release = false  # no build artifacts; the release notes come from the changelog
