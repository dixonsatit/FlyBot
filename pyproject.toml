[project]
name = "flybot"
version = "0.1.0"
description = "FlyWire Codex connectome circuits driving an M5Stack StackChan over MQTT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "nengo>=4.0", "paho-mqtt>=2.0"]

[project.optional-dependencies]
fast = ["scipy>=1.10"]
dev = ["pytest>=7"]
llm = ["anthropic>=1.11", "openai>=3"]

[project.scripts]
flybot-mqtt = "flybot.mqtt_bridge:main"
flybot-sim = "flybot.sim:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flybot"]

[tool.pytest.ini_options]
addopts = "-p no:nengo"
filterwarnings = ["ignore::UserWarning:nengo"]
